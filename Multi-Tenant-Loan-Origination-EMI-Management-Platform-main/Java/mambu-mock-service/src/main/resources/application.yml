server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: mambu-mock-service

  datasource:
    url: jdbc:h2:mem:mambudb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

mambu:
  mock:
    simulate-delay-ms: 150        # artificial delay to mimic real Mambu latency
    error-rate-percent: 0         # set > 0 to simulate random Mambu errors
    default-currency: INR
    encoded-key-length: 24

