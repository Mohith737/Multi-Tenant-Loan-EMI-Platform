spring.application.name=loan-platform
server.port=8080

spring.datasource.url=jdbc:h2:mem:loanplatform;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

mambu.base-url=${MAMBU_BASE_URL:http://localhost:${server.port}}

app.security.admin.username=${APP_SECURITY_ADMIN_USERNAME:platform_admin}
app.security.admin.password=${APP_SECURITY_ADMIN_PASSWORD:platform_admin_password}
app.security.tenant-admin.username=${APP_SECURITY_TENANT_ADMIN_USERNAME:tenant_admin}
app.security.tenant-admin.password=${APP_SECURITY_TENANT_ADMIN_PASSWORD:tenant_admin_password}
app.security.borrower.username=${APP_SECURITY_BORROWER_USERNAME:borrower_user}
app.security.borrower.password=${APP_SECURITY_BORROWER_PASSWORD:borrower_password}
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:loan_platform_dev_jwt_secret_please_change_12345}
app.security.jwt.expiry-seconds=${APP_SECURITY_JWT_EXPIRY_SECONDS:3600}
app.security.pan-encryption-key=${APP_SECURITY_PAN_ENCRYPTION_KEY:loan_platform_pan_encrypt_key_2026}

app.mambu.sync.retry-ms=${APP_MAMBU_SYNC_RETRY_MS:300000}
app.loan.offer-validity-hours=${APP_LOAN_OFFER_VALIDITY_HOURS:48}
app.loan.offer-expiry-scan-ms=${APP_LOAN_OFFER_EXPIRY_SCAN_MS:60000}
app.flow4.documents.low-amount-max=${APP_FLOW4_DOCS_LOW_AMOUNT_MAX:300000}
app.flow4.documents.mid-amount-max=${APP_FLOW4_DOCS_MID_AMOUNT_MAX:700000}
app.flow5.redis.idempotency-ttl-seconds=${APP_FLOW5_REDIS_IDEMPOTENCY_TTL_SECONDS:300}
app.flow5.schedule-retry-ms=${APP_FLOW5_SCHEDULE_RETRY_MS:300000}
app.flow6.max-retry-count=${APP_FLOW6_MAX_RETRY_COUNT:3}
app.flow6.redis.idempotency-ttl-seconds=${APP_FLOW6_REDIS_IDEMPOTENCY_TTL_SECONDS:300}
app.flow6.webhook-dedupe-ttl-seconds=${APP_FLOW6_WEBHOOK_DEDUPE_TTL_SECONDS:86400}
app.flow6.scheduler.zone=${APP_FLOW6_SCHEDULER_ZONE:Asia/Kolkata}
app.flow6.scheduler.collection-cron=${APP_FLOW6_SCHEDULER_COLLECTION_CRON:0 0 9 * * *}
app.flow6.scheduler.retry-cron=${APP_FLOW6_SCHEDULER_RETRY_CRON:0 0 18 * * *}
app.flow6.scheduler.reconciliation-cron=${APP_FLOW6_SCHEDULER_RECONCILIATION_CRON:0 0 23 * * *}
app.flow6.scheduler.mambu-sync-retry-cron=${APP_FLOW6_SCHEDULER_MAMBU_SYNC_RETRY_CRON:0 */5 * * * *}
app.flow7.quote-ttl-seconds=${APP_FLOW7_QUOTE_TTL_SECONDS:900}
app.flow7.redis.idempotency-ttl-seconds=${APP_FLOW7_REDIS_IDEMPOTENCY_TTL_SECONDS:300}
app.flow7.webhook-dedupe-ttl-seconds=${APP_FLOW7_WEBHOOK_DEDUPE_TTL_SECONDS:86400}
app.flow8.npa-dpd-threshold=${APP_FLOW8_NPA_DPD_THRESHOLD:90}
app.flow8.scheduler.zone=${APP_FLOW8_SCHEDULER_ZONE:Asia/Kolkata}
app.flow8.scheduler.flag-cron=${APP_FLOW8_SCHEDULER_FLAG_CRON:0 30 2 * * *}
app.flow8.scheduler.escalation-cron=${APP_FLOW8_SCHEDULER_ESCALATION_CRON:0 45 2 * * *}
app.flow8.redis.flag-ttl-seconds=${APP_FLOW8_REDIS_FLAG_TTL_SECONDS:86400}
app.flow8.redis.override-lock-ttl-seconds=${APP_FLOW8_REDIS_OVERRIDE_LOCK_TTL_SECONDS:300}
app.flow8.redis.escalation-ttl-seconds=${APP_FLOW8_REDIS_ESCALATION_TTL_SECONDS:86400}
app.kafka.topic.emi-collected=${APP_KAFKA_TOPIC_EMI_COLLECTED:emi.collected}
app.kafka.topic.emi-failed=${APP_KAFKA_TOPIC_EMI_FAILED:emi.failed}
app.kafka.topic.emi-overdue=${APP_KAFKA_TOPIC_EMI_OVERDUE:emi.overdue}

app.stripe.enabled=${APP_STRIPE_ENABLED:false}
app.stripe.api-key=${APP_STRIPE_API_KEY:}
app.stripe.currency=${APP_STRIPE_CURRENCY:inr}
app.stripe.webhook-secret=${APP_STRIPE_WEBHOOK_SECRET:}
app.stripe.mock.disbursement-transfer-enabled=${APP_STRIPE_MOCK_DISBURSEMENT_TRANSFER_ENABLED:false}
app.stripe.mock.destination-prefix=${APP_STRIPE_MOCK_DESTINATION_PREFIX:acct_mock_}

app.notification.email.enabled=${APP_NOTIFICATION_EMAIL_ENABLED:false}
app.notification.email.from-address=${APP_NOTIFICATION_EMAIL_FROM_ADDRESS:no-reply@loanos.local}
app.notification.email.override-to=${APP_NOTIFICATION_EMAIL_OVERRIDE_TO:}
spring.mail.host=${APP_NOTIFICATION_EMAIL_SMTP_HOST:localhost}
spring.mail.port=${APP_NOTIFICATION_EMAIL_SMTP_PORT:1025}
spring.mail.username=${APP_NOTIFICATION_EMAIL_SMTP_USERNAME:}
spring.mail.password=${APP_NOTIFICATION_EMAIL_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${APP_NOTIFICATION_EMAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${APP_NOTIFICATION_EMAIL_SMTP_STARTTLS:false}

app.notification.sms.enabled=${APP_NOTIFICATION_SMS_ENABLED:false}
app.notification.sms.provider-url=${APP_NOTIFICATION_SMS_PROVIDER_URL:https://example.com/fake-sms}
app.notification.sms.api-key=${APP_NOTIFICATION_SMS_API_KEY:fake_sms_api_key}
app.notification.sms.sender-id=${APP_NOTIFICATION_SMS_SENDER_ID:LOANOS}
app.notification.sms.override-to=${APP_NOTIFICATION_SMS_OVERRIDE_TO:}

# Current project uses Spring Cloud 2025 with Boot 3.3.x in this workspace.
# Disable compatibility verifier to allow startup with this dependency set.
spring.cloud.compatibility-verifier.enabled=false
